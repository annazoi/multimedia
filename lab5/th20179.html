<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>th20179</title>

		<script type="text/javascript" src="https://www.x3dom.org/download/x3dom.js"></script>
		<link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css" />

		<script>
			function changeColor(materialNode) {
				let color = materialNode.getAttribute('diffuseColor');

				// enallagi apo kokkino se mple kai antistrofa
				if (color === '1 0 0') materialNode.setAttribute('diffuseColor', '0 0 1');
				else materialNode.setAttribute('diffuseColor', '1 0 0');
			}
		</script>
	</head>

	<body>
		<x3d width="100%" height="100%">
			<scene>
				<shape onclick="changeColor(this.getElementsByTagName('material')[0]);">
					<appearance>
						<material diffuseColor="1 0 0"></material>
					</appearance>
					<box></box>
				</shape>

				<transform translation="3 0 0">
					<shape onclick="changeColor(this.getElementsByTagName('material')[0]);">
						<appearance>
							<material diffuseColor="1 0 0"></material>
						</appearance>
						<sphere></sphere>
					</shape>
				</transform>

				<transform translation="-3 0 0">
					<shape onclick="changeColor(this.getElementsByTagName('material')[0]);">
						<appearance>
							<material diffuseColor="1 0 0"></material>
						</appearance>
						<cone></cone>
					</shape>
				</transform>
			</scene>
		</x3d>
	</body>
</html>
