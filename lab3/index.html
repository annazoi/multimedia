<!DOCTYPE html>
<html lang="el">
	<head>
		<meta charset="UTF-8" />
		<title>Anna Zoi - Th20179</title>

		<script>
			// Μόλις ανοίξει η σελίδα και είναι έτοιμη, τρέχει τον κώδικα.
			window.onload = function () {
				// Παίρνουμε τον canva και το context
				let canvas = document.getElementById('myCanvas');
				let ctx = canvas.getContext('2d');

				// Δημιουργούμε 2 αντικείμενα εικόνας
				let img1 = new Image();
				let img2 = new Image();

				img1.src = './blue.jpg';
				img2.src = './red.jpg';

				// Ελεγχος για το πότε θα έχουν φορτώσει και οι δύο
				let loaded = 0;

				function onImageLoad() {
					// Όταν φορτώσει κάθε εικόνα, αυξάνουμε κατα 1
					loaded++;
					// Μόλις οι δύο εικόνες φορτωθούν (loaded === 2)
					if (loaded === 2) {
						// Καλούμε τη συνάρτηση
						drawAndBlend();
					}
				}

				img1.onload = onImageLoad;
				img2.onload = onImageLoad;

				// Σχεδιάζουμε τις εικόνες στον καμβά
				function drawAndBlend() {
					// Ζωγραφίζουμε την πρώτη εικόνα και παίρνουμε pixels
					ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
					// η getImageData παίρνει όλα τα pixel της εικόνας
					let imgData1 = ctx.getImageData(0, 0, canvas.width, canvas.height);

					ctx.drawImage(img2, 0, 0, canvas.width, canvas.height);
					let imgData2 = ctx.getImageData(0, 0, canvas.width, canvas.height);

					// Παίρνουμε τα arrays με τα pixels
					let data1 = imgData1.data;
					let data2 = imgData2.data;

					// Κάνουμε την μίξη χρώματος pixel-pixel
					for (let i = 0; i < data1.length; i += 4) {
						data1[i] = (data1[i] + data2[i]) / 2; // R
						data1[i + 1] = (data1[i + 1] + data2[i + 1]) / 2; // G
						data1[i + 2] = (data1[i + 2] + data2[i + 2]) / 2; // B
					}

					// Ζωγραφίζουμε τη νέα εικόνα με την μίξη
					ctx.putImageData(imgData1, 0, 0);
				}
			};
		</script>
	</head>
	<body>
		<canvas id="myCanvas" width="600" height="400"></canvas>
	</body>
</html>
