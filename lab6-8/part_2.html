<!-- Υλοποιήστε την ίδια άσκηση αλλά 
 χρησιμοποιώντας ως χρονισμό την requestAnimationFrame() 
 που μάθαμε σε προηγούμενες ασκήσεις. Προσοχή στο transform της σφαίρας
  που θα κάνει animation θα του δώσετε ID αντί για def και θα του αλλάζετε 
  το attribute  translation στις διαδοχικές τιμές 000, 030, 000 μέσω javascript  
  (document.getElementById("ball").setAttribute('translation', '0 0 0'); -->

<html>
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<script src="https://www.x3dom.org/download/x3dom.js"></script>
		<link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css" />
	</head>

	<body>
		<x3d width="500px" height="400px">
			<scene>
				<transform id="ball">
					<shape>
						<appearance>
							<material diffuseColor="0 0 1"></material>
						</appearance>
						<sphere></sphere>
					</shape>
				</transform>
			</scene>
		</x3d>

		<script>
			const positions = ['0 0 0', '0 3 0', '3 3 0', '3 0 0', '0 0 3', '0 0 0'];

			const ball = document.getElementById('ball');

			let index = 0;
			const totalTime = 10000; // 10 sec
			const segment = totalTime / positions.length;
			let last = performance.now();

			function animate(now) {
				if (now - last >= segment) {
					index = (index + 1) % positions.length;
					ball.setAttribute('translation', positions[index]);
					last = now;
				}
				requestAnimationFrame(animate);
			}

			requestAnimationFrame(animate);
		</script>
	</body>
</html>
